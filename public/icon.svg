<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C30"/>
      <stop offset="50%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Obsidian Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Subtle Top Sheen -->
  <path d="M 134 24 L 378 24" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Hourglass Geometry -->
  <g filter="url(#neonGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top & Bottom Bars -->
    <path d="M 196 150 L 316 150 M 196 362 L 316 362" stroke="url(#neonCyan)" stroke-width="12" />
    
    <!-- Hourglass Body -->
    <path d="M 206 156 L 306 156 L 256 256 Z" fill="none" stroke="url(#neonCyan)" stroke-width="10" />
    <path d="M 206 356 L 306 356 L 256 256 Z" fill="none" stroke="url(#neonCyan)" stroke-width="10" />
    
    <!-- Infinity Ribbon Weave -->
    <path d="M 256 256 C 210 200, 140 210, 140 266 C 140 320, 210 320, 256 266 C 302 212, 372 212, 372 266 C 372 322, 302 332, 256 256 Z" 
          fill="none" stroke="url(#neonPurple)" stroke-width="14" />
  </g>
</svg>
